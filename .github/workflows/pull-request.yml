name: Pull Request

on:
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Both job check contexts below are required by the master branch ruleset;
# renaming a job strands PRs.
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HUSKY: 0
    steps:
      - name: Checkout repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Use Node 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20.x'
          cache: yarn

      - name: Install deps
        run: yarn install --frozen-lockfile --no-progress --ignore-scripts

      - name: Verify
        run: make verify
        env:
          SKIP_INSTALL: 1

      - name: Size limit
        run: npx size-limit

  pr-security-check:
    name: PR Security Check
    uses: Basis-Theory/public-security-workflows/.github/workflows/pr-check.yml@1c4c50f381f092a48dbb8dfd7340dcd451653688 # master
    secrets: inherit
